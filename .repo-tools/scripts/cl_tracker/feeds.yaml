# Curated blogs & newsletters (topic-gated RSS/Atom), tiered by CL relevance.
# tier_weight multiplies an item's topic score. Items that fail the topic gate
# are dropped regardless of tier. Feeds that 404/redirect are skipped gracefully.

tiers:
  1: 2.0   # CL-specific / directly relevant
  2: 1.5   # mechanism / architecture / representations / interp
  3: 1.2   # fine-tuning / practical training / evals
  4: 1.0   # curation layers
  5: 1.0   # lab research blogs (release-triggered)

feeds:
