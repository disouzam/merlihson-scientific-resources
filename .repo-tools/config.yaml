# Repository Automation Tool Configuration
# =========================================

# SAFETY: This tool NEVER deletes files. It only modifies READMEs and metadata.

repo_root: ".."  # Relative to .repo-tools/

# Directories to watch for changes
watched_paths:
  reviews:
    path: "mike-paper-reviews-all/split-reviews-docx"
    pattern: "*.docx"
    triggers:
      - count_files
      - sync_metadata
      - update_readme_stats
      - update_svg_stats

  learning_materials:
    path: "learning materials"
    recursive: true
    triggers:
      - count_categories
      - detect_duplicates  # REPORT ONLY - never deletes
      - update_readme_stats

  presentations:
    path: "presentations"
    pattern: "*.pdf"
    triggers:
      - count_files
      - update_readme_stats

# Files that CAN be modified (whitelist)
modifiable_files:
  - "README.md"
  - "readme.md"
  - "mike-paper-reviews-all/reviews_metadata/*.txt"
  - "mike-paper-reviews-all/reviews_metadata/*.csv"
  - "mike-paper-reviews-all/readme.md"
  - "images/cosmic-neural-header.svg"

# Stats update locations
stats:
  main_readme:
    path: "README.md"
    updates:
      - pattern: '(<h3>📄 )\d+\+?(</h3>)'
        replacement: '\g<1>{reviews}+\2'
        description: "Papers count in highlights"
      - pattern: '(<h3>📚 )\d+(</h3>)'
        replacement: '\g<1>{categories}\2'
        description: "Categories count in highlights"
      - pattern: '(<h3>🎯 )[\d.]+( GB</h3>)'
        replacement: '\g<1>{size_gb:.1f}\2'
        description: "Repo size in highlights"

  svg_header:
    path: "images/cosmic-neural-header.svg"
    updates:
      - pattern: '(font-weight="700" fill="#58a6ff">)\d+\+?(</text>)'
        replacement: '\g<1>{reviews}+\2'
        description: "Papers count in SVG"
      - pattern: '(font-weight="700" fill="#a371f7">)\d+(</text>)'
        replacement: '\g<1>{categories}\2'
        description: "Categories count in SVG"
      - pattern: '(font-weight="700" fill="#3fb950">)[\d.]+( GB</text>)'
        replacement: '\g<1>{size_gb:.1f}\2'
        description: "Repo size in SVG"

# Debounce settings (wait for batch operations to settle)
debounce:
  wait_seconds: 2.0
  max_wait_seconds: 10.0

# Logging
logging:
  level: INFO
  emoji_indicators: true
