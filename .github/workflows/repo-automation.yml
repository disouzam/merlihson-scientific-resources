name: Repository Automation

# Trigger on pushes to main branch when content files change
on:
  push:
    branches:
      - main
    paths:
      # Watch content directories
      - 'mike-paper-reviews-all/**'
      - 'learning materials/**'
      - 'presentations/**'
      # But not the automation tool itself
      - '!.repo-tools/**'
      - '!.github/**'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-stats:
    name: Update Repository Stats
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate stats

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.repo-tools/requirements.txt'

      - name: Install dependencies
        run: |
          cd .repo-tools
          pip install -r requirements.txt

      - name: Run automation (scan & update)
        id: automation
        run: |
          cd .repo-tools
          python -m repo_automator run --verbose
        continue-on-error: false

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md 'mike-paper-reviews-all/readme.md' images/cosmic-neural-header.svg
          git add 'mike-paper-reviews-all/reviews_metadata/*.txt' 'mike-paper-reviews-all/reviews_metadata/*.csv' || true
          git commit -m "📊 Auto-update repository statistics

          Updated by repo-automation workflow.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>" || echo "No changes to commit"
          git push

      - name: Summary
        run: |
          echo "## 📊 Repository Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "✅ Statistics updated and committed." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes needed - statistics already up to date." >> $GITHUB_STEP_SUMMARY
          fi
